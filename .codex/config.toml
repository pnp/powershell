# Project-scoped Codex configuration for this repository.
#
# Loaded only when the project is trusted - Codex prompts on first use of a directory, and skips
# every project-local `.codex/` layer (this file, the agents, hooks and rules) while it is untrusted.
# If `/mcp` shows no servers, check trust before debugging anything else.
#
# Committing this means a contributor gets Microsoft Learn without any setup, which matters because
# `permissions-auditor` and `cmdlet-scaffolder` treat a Learn lookup as mandatory rather than
# optional. See `.agents/README.md` for what each server is for.

# Unauthenticated. Nothing to configure.
[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"

# The `/readonly` suffix restricts the toolset to read access, so this server cannot create issues,
# open or merge pull requests, or comment - see "Human in the loop" in AGENTS.md. Keep the suffix.
#
# `bearer_token_env_var` is the NAME of an environment variable, never the token itself; nothing
# secret belongs in a committed file. Export GITHUB_PAT_TOKEN before starting Codex, or drop the line
# and run `codex mcp login github` instead. Without one of the two this server returns 401 and
# `issue-triage` will ask you to paste the issue rather than guess at it.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/readonly"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
