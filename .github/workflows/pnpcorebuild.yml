name: PnP Core Build

on:
  workflow_dispatch:
    inputs:
      pnpcore_ref:
        description: PnP.Core branch, tag, or SHA to build
        required: true
        default: dev
        type: string

permissions: read-all

jobs:
  build_sign_package:
    name: Build, sign, and package PnP.Core
    runs-on: windows-latest
    environment:
      name: gh_releases
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout PnP.Core
        uses: actions/checkout@v4
        with:
          repository: pnp/pnpcore
          path: pnpcore
          ref: ${{ inputs.pnpcore_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install Sign CLI tool
        shell: pwsh
        run: |
          $signToolPath = Join-Path $env:RUNNER_TEMP "sign"
          dotnet tool install sign --tool-path $signToolPath --version 0.9.1-beta.25181.2
          "SIGN_CLI_PATH=$(Join-Path $signToolPath 'sign.exe')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGNING_TENANTID }}
          allow-no-subscriptions: true

      - name: Install PnP.Core dependencies
        shell: pwsh
        run: dotnet restore
        working-directory: pnpcore/src/sdk

      - name: Build PnP.Core
        shell: pwsh
        run: dotnet build --configuration Release --no-restore -p:WarningLevel=0
        working-directory: pnpcore/src/sdk/PnP.Core

      - name: Build PnP.Core.Auth
        shell: pwsh
        run: dotnet build --configuration Release --no-restore -p:WarningLevel=0
        working-directory: pnpcore/src/sdk/PnP.Core.Auth

      - name: Build PnP.Core.Admin
        shell: pwsh
        run: dotnet build --configuration Release --no-restore -p:WarningLevel=0
        working-directory: pnpcore/src/sdk/PnP.Core.Admin

      - name: Sign PnP.Core DLLs
        shell: pwsh
        env:
          SIGNING_TENANTID: ${{ secrets.SIGNING_TENANTID }}
          SIGNING_CLIENT_ID: ${{ secrets.SIGNING_CLIENT_ID }}
          SIGNING_CERTNAME: ${{ secrets.SIGNING_CERTNAME }}
          SIGNING_VAULTURL: ${{ secrets.SIGNING_VAULTURL }}
        run: |
          $assemblies = @(
            @{ Name = "PnP.Core"; Root = "pnpcore/src/sdk/PnP.Core/bin/Release"; FileName = "PnP.Core.dll" },
            @{ Name = "PnP.Core.Auth"; Root = "pnpcore/src/sdk/PnP.Core.Auth/bin/Release"; FileName = "PnP.Core.Auth.dll" },
            @{ Name = "PnP.Core.Admin"; Root = "pnpcore/src/sdk/PnP.Core.Admin/bin/Release"; FileName = "PnP.Core.Admin.dll" }
          )

          $coreDlls = @($assemblies | ForEach-Object {
            $assembly = $_
            if (!(Test-Path -LiteralPath $assembly.Root)) {
              throw "Output folder was not found for $($assembly.Name): $($assembly.Root)"
            }

            $assemblyDlls = @(Get-ChildItem -LiteralPath $assembly.Root -Directory | ForEach-Object {
              $dllPath = Join-Path $_.FullName $assembly.FileName
              if (Test-Path -LiteralPath $dllPath) {
                Get-Item -LiteralPath $dllPath
              }
            })

            if ($assemblyDlls.Count -eq 0) {
              throw "No $($assembly.FileName) files were found to sign."
            }

            $assemblyDlls
          })

          if ($coreDlls.Count -eq 0) {
            throw "No PnP.Core DLL files were found to sign."
          }

          foreach ($coreDll in $coreDlls) {
            Write-Host "Signing $($coreDll.FullName)"

            & $env:SIGN_CLI_PATH code azure-key-vault $coreDll.FullName `
              --publisher-name "Microsoft 365 Patterns and Practices" `
              --description "PnP Core SDK" `
              --description-url "https://pnp.github.io/pnpcore/" `
              --azure-key-vault-tenant-id $env:SIGNING_TENANTID `
              --azure-key-vault-client-id $env:SIGNING_CLIENT_ID `
              --azure-key-vault-certificate $env:SIGNING_CERTNAME `
              --azure-key-vault-url $env:SIGNING_VAULTURL `
              --timestamp-url "http://timestamp.digicert.com" `
              --verbosity Debug

            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($coreDll.FullName)"
            }
          }

      - name: Pack signed NuGet packages
        shell: pwsh
        run: |
          $packageOutput = Join-Path $env:GITHUB_WORKSPACE "output/packages"
          New-Item -Path $packageOutput -ItemType Directory -Force | Out-Null

          $projects = @(
            "pnpcore/src/sdk/PnP.Core/PnP.Core.csproj",
            "pnpcore/src/sdk/PnP.Core.Auth/PnP.Core.Auth.csproj",
            "pnpcore/src/sdk/PnP.Core.Admin/PnP.Core.Admin.csproj"
          )

          foreach ($project in $projects) {
            dotnet pack $project --configuration Release --no-build --no-restore --output $packageOutput

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet pack failed for $project"
            }
          }

          $packages = @(Get-ChildItem -LiteralPath $packageOutput -File | Where-Object { $_.Extension -in ".nupkg", ".snupkg" })
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were created."
          }

      - name: Create package zip file
        shell: pwsh
        run: |
          $packageOutput = Join-Path $env:GITHUB_WORKSPACE "output/packages"
          $zipRoot = Join-Path $env:GITHUB_WORKSPACE "output/zips"
          $zipPath = Join-Path $zipRoot "PnP.Core-packages.zip"

          New-Item -Path $zipRoot -ItemType Directory -Force | Out-Null

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          $packages = @(Get-ChildItem -LiteralPath $packageOutput -File | Where-Object { $_.Extension -in ".nupkg", ".snupkg" })
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found to zip."
          }

          Compress-Archive -Path $packages.FullName -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Created $zipPath"

      - name: Upload package zip file
        uses: actions/upload-artifact@v4
        with:
          name: PnP.Core-packages
          path: output/zips/PnP.Core-packages.zip
          if-no-files-found: error