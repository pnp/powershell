name: Stable Release to Docker Hub

on:
  workflow_dispatch:

permissions: read-all

jobs:
  compute-version:
    if: github.repository_owner == 'pnp'
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.v.outputs.VERSION }}
    steps:
    # The images install the module from the PowerShell Gallery, so its latest stable release is the version to publish
    - id: v
      shell: pwsh
      run: |
        $version = (Find-Module -Name PnP.PowerShell -Repository PSGallery).Version
        "VERSION=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

  publish-docker-windows-amd64:
    if: github.repository_owner == 'pnp'
    runs-on: windows-2025
    needs: compute-version
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v6
      with:
        ref: main
    - name: Build an image
      run: |
        $VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker build --build-arg PNP_VERSION=$VERSION --platform windows/amd64 ./docker -f ./docker/windows-amd64.dockerfile --tag ${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-windows-amd64
    - name: Push the image
      run: |
        $VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}'
        docker push "${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-windows-amd64"

  publish-docker-linux-arm32v7:
    if: github.repository_owner == 'pnp'
    runs-on: ubuntu-latest
    needs: compute-version
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v6
      with:
        ref: main
    # Buildx emulates arm32 on the x64 runner; the image installs the module each time a container starts
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build & push the image
      uses: docker/build-push-action@v7
      with:
        context: ./docker
        file: ./docker/linux-arm32.dockerfile
        platforms: linux/arm/v7
        push: true
        tags: ${{ secrets.DOCKER_ORG }}/powershell:${{ needs.compute-version.outputs.VERSION }}-stable-linux-arm32v7
        build-args: |
          PNP_VERSION=${{ needs.compute-version.outputs.VERSION }}
        # Keeps the tag a single image manifest, without an attestation entry
        provenance: false
        sbom: false

  publish-docker-linux-arm64:
    if: github.repository_owner == 'pnp'
    runs-on: ubuntu-24.04-arm
    needs: compute-version
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v6
      with:
        ref: main
    - name: Build an image
      run: |
        VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker build --build-arg PNP_VERSION=$VERSION --platform linux/arm64/v8 ./docker -f ./docker/linux-arm64.dockerfile --tag ${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-linux-arm64
    - name: Push the image
      run: |
        VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}'
        docker push "${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-linux-arm64"

  publish-docker-linux-amd64:
    if: github.repository_owner == 'pnp'
    runs-on: ubuntu-latest
    needs: compute-version
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v6
      with:
        ref: main
    - name: Build an image
      run: |
        VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker build --build-arg PNP_VERSION=$VERSION --platform linux/amd64 ./docker -f ./docker/linux-amd64.dockerfile --tag ${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-linux-amd64
    - name: Push the image
      run: |
        VERSION="${{ needs.compute-version.outputs.VERSION }}"
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}'
        docker push "${{ secrets.DOCKER_ORG }}/powershell:$VERSION-stable-linux-amd64"

  publish-docker-manifest:
    if: github.repository_owner == 'pnp'
    runs-on: ubuntu-latest
    needs: [ compute-version, publish-docker-linux-arm32v7, publish-docker-linux-arm64, publish-docker-linux-amd64, publish-docker-windows-amd64 ]
    steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    # imagetools accepts platform tags that are themselves image indexes, such as a build carrying a provenance
    # attestation (3.5.0-stable-linux-amd64 was one); docker manifest create rejects them
    - name: Publish manifest
      run: |
        IMAGE="${{ secrets.DOCKER_ORG }}/powershell"
        VERSION="${{ needs.compute-version.outputs.VERSION }}-stable"
        docker buildx imagetools create \
          -t $IMAGE:$VERSION \
          -t $IMAGE:stable \
          -t $IMAGE:latest \
          $IMAGE:$VERSION-linux-amd64 \
          $IMAGE:$VERSION-linux-arm32v7 \
          $IMAGE:$VERSION-linux-arm64 \
          $IMAGE:$VERSION-windows-amd64
